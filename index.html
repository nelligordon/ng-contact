
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Got Aflac? - Nelli Gordon</title>

<style>

* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: #fff;
}

body {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    overflow: hidden;
}

.flyer {
    position: relative;
    width: min(100vw, calc(100dvh * 1025 / 1528));
    height: min(100dvh, calc(100vw * 1528 / 1025));
    max-width: 100vw;
    max-height: 100dvh;
    aspect-ratio: 1025 / 1528;
    flex-shrink: 0;
}

.flyer img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
}

/* Transparent interaction areas align with the printed artwork. */
.phone-link {
    position: absolute;
    left: 7.8%;
    top: 63.5%;
    width: 84.6%;
    height: 6.8%;
    display: block;
    cursor: pointer;
    z-index: 4;
    border: 0;
    border-radius: 3%;
    padding: 0;
    background: transparent;
    color: transparent;
    font-size: 0;
    -webkit-tap-highlight-color: transparent;
}

.qr-link {
    position: absolute;
    left: 54.0%;
    top: 34.4%;
    width: 38.7%;
    height: 26.3%;
    display: block;
    cursor: pointer;
    z-index: 3;
    border: 0;
    padding: 0;
    background: transparent;
    -webkit-tap-highlight-color: transparent;
}

.email-link {
    position: absolute;
    left: 7.8%;
    top: 70.8%;
    width: 84.6%;
    height: 6.8%;
    display: block;
    cursor: pointer;
    z-index: 5;
    border: 0;
    border-radius: 3%;
    padding: 0;
    background: transparent;
    color: transparent;
    font-size: 0;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
}

.phone-link:focus-visible,
.email-link:focus-visible,
.qr-link:focus-visible {
    outline: 3px solid #008fd3;
    outline-offset: 2px;
}

/* Call / SMS popup */
.contact-menu {
    display: none;
    position: absolute;
    left: 2%;
    top: 60%;
    width: 94%;
    min-width: 135px;
    background: #fff;
    border: 1px solid #b9def5;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0, 65, 120, 0.22);
    padding: 9px;
    z-index: 10;
    font-family: Arial, sans-serif;
}

.contact-menu.show { display: block; }

.menu-title {
    color: #064987;
    font-size: clamp(11px, 1.5vw, 15px);
    font-weight: bold;
    text-align: center;
    padding: 5px 2px 9px;
}

.contact-menu a {
    display: block;
    text-decoration: none;
    text-align: center;
    padding: 10px 5px;
    margin-top: 5px;
    border-radius: 7px;
    background: #078ed2;
    color: #fff;
    font-weight: bold;
    font-size: clamp(12px, 1.6vw, 16px);
}

.contact-menu a:active { background: #07529b; }

.contact-menu .close-menu {
    background: #edf6fc;
    color: #07529b;
    font-size: 12px;
}

.contact-menu a:focus-visible {
    outline: 3px solid #064987;
    outline-offset: 2px;
}

@media (max-height: 520px) and (orientation: landscape) {
    .contact-menu { top: 53%; }
}

</style>
</head>

         alt="Got Aflac? Contact Nelli Gordon about insurance coverage.">

    <!-- Tap the QR code to add Nelli Gordon to the address book -->
    <button class="qr-link"
            id="qrButton"
            aria-label="Add Nelli Gordon to your contacts"
            title="Add Nelli Gordon to your contacts">
    </button>

    <!-- Tap to show Call / SMS choices -->
    <button class="phone-link"
            id="phoneButton"
            aria-label="Choose to call or send SMS"
            aria-haspopup="true"
            aria-expanded="false">818.261.2471</button>

    <!-- Call / SMS popup -->
    <div class="contact-menu" id="contactMenu">

        <div class="menu-title">
            Contact Nelli Gordon
        </div>

        <a href="tel:+18182612471">
            📞 Call
        </a>

        <a href="sms:+18182612471">
            💬 Send SMS
        </a>

        <a href="#" class="close-menu" id="closeMenu">
            Cancel
        </a>

    </div>

    <!-- Opens the device's default email app with a new message addressed to Nelli -->
    <a class="email-link"
       href="mailto:nelli_gordon@us.aflac.com"
       target="_self"
       aria-label="Compose an email to Nelli Gordon"
       title="Compose an email to Nelli Gordon">nelli_gordon@us.aflac.com</a>

</main>

<script>
const qrButton = document.getElementById('qrButton');

qrButton.addEventListener('click', async function() {
    if (!window.confirm('Add Nelli Gordon to your address book?')) return;

    // Standard vCard 3.0. Keep this data in sync with the flyer.
    const vCard = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        'N:Gordon;Nelli;;;',
        'FN:Nelli Gordon',
        'TEL;TYPE=CELL,VOICE:+18182612471',
        'EMAIL;TYPE=INTERNET:nelli_gordon@us.aflac.com',
        'ORG:Aflac',
        'END:VCARD'
    ].join('\r\n') + '\r\n';

    const contactFile = new File(
        [vCard],
        'Nelli-Gordon.vcf',
        { type: 'text/vcard;charset=utf-8' }
    );

    // iPhone/iPad Safari: open the vCard directly instead of invoking the
    // iOS Share Sheet (which displays the Actions menu). Safari should hand
    // the vCard to its contact preview/import flow.
    const isAppleMobile = /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    if (isAppleMobile) {
        const vCardUrl = URL.createObjectURL(
            new Blob([vCard], { type: 'text/vcard;charset=utf-8' })
        );
        // Navigate directly to the contact file; do not call navigator.share().
        window.location.href = vCardUrl;
        // Keep the object URL alive long enough for Safari to load the file.
        window.setTimeout(function() {
            URL.revokeObjectURL(vCardUrl);
        }, 60000);
        return;
    }

    // Android: use the native share sheet when it supports sharing vCard files.
    const isAndroid = /Android/i.test(navigator.userAgent);
    if (isAndroid &&
        typeof navigator.share === 'function' &&
        typeof navigator.canShare === 'function' &&
        navigator.canShare({ files: [contactFile] })) {
        try {
            await navigator.share({
                files: [contactFile],
                title: 'Nelli Gordon contact',
                text: 'Add Nelli Gordon to your contacts'
            });
            return;
        } catch (error) {
            // A deliberate cancellation should not trigger an unexpected download.
            if (error && error.name === 'AbortError') return;
            // If sharing fails, use the downloadable vCard below.
        }
    }

    // Desktop fallback, and fallback for mobile browsers that cannot share
    // vCard files. Opening the downloaded .vcf imports it into Contacts.
    const blob = new Blob([vCard], { type: 'text/vcard;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const downloadLink = document.createElement('a');
    downloadLink.href = url;
    downloadLink.download = 'Nelli-Gordon.vcf';
    downloadLink.style.display = 'none';
    document.body.appendChild(downloadLink);
    downloadLink.click();
    downloadLink.remove();

    window.setTimeout(function() {
        URL.revokeObjectURL(url);
    }, 10000);
});

const phoneButton = document.getElementById('phoneButton');
const contactMenu = document.getElementById('contactMenu');
const closeMenu = document.getElementById('closeMenu');

function toggleMenu(show) {
    contactMenu.classList.toggle('show', show);
    phoneButton.setAttribute('aria-expanded', show);
}

phoneButton.addEventListener('click', function() {
    toggleMenu(!contactMenu.classList.contains('show'));
});

closeMenu.addEventListener('click', function(event) {
    event.preventDefault();
    toggleMenu(false);
});

document.addEventListener('click', function(event) {
    if (!phoneButton.contains(event.target) &&
        !contactMenu.contains(event.target)) {
        toggleMenu(false);
    }
});

document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
        toggleMenu(false);
    }
});
</script>
